name: ESP-IDF CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: esp-idf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ESP-IDF toolchain
        uses: espressif/esp-idf-tools-action@v1
        with:
          esp_idf_version: v5.5.1

      - name: Show ESP-IDF version
        run: idf.py --version

      - name: Build project
        run: |
          idf.py set-target ${{ matrix.target }}
          idf.py build
